<!DOCTYPE html>
<html>

<head></head>

<body>
    <div id="root"></div>
</body>
<script src="https://unpkg.com/react@17.0.2/umd/react.production.min.js">
</script>
<script src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.production.min.js">
</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">

    //State는 기본적으로 데이터가 저장되는 곳이다.
    const root = document.getElementById("root");
    const span = React.createElement("span");

    function render() {
    }

    //input 내의 onChange는 내부 값의 변경이 존재하면, 그 변경을 감지한다. 
    function Container() {
        const onChange = (event) => {
            console.log(event.target.value);
            // console.log(event);
            setAmount(event.target.value);
        };
        
       const [amount, setAmount] = React.useState();
       const [flip, setFlip] = React.useState(false);

        const reset = () => setAmount(0);
        const onFlip = () => {
            reset();
            setFlip((current) => !current)};
        return (<div>
            <h3>
                converter
            </h3>
            <label htmlFor="min">min</label>
            <input 
                value={flip ? amount * 60 : amount} 
                id="min" 
                placeholder="Mins" 
                type="number" 
                onChange={onChange}
                disabled={flip === true}
                 />
            <h4> Convert {amount} </h4>

            <label htmlFor="hour">hour</label>
            <input 
                value={flip ? amount : Math.round(amount/60)}  
                id="hour" 
                placeholder="Hours" 
                type="number" 
                onChange={onChange}
                disabled={flip === false}
                 />
            <button onClick={reset}>Reset</button>
            <button onClick={onFlip}>Flip</button>
        </div>);
    }

    ReactDOM.render(<Container />, root);
</script>

</html>
