<!DOCTYPE html>
<html>

<head></head>

<body>
    <div id="root"></div>
</body>
<script src="https://unpkg.com/react@17.0.2/umd/react.production.min.js">
</script>
<script src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.production.min.js">
</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">

    //컴포넌트는 다른 컴포넌트들을 여러개 가질 수 있다.
    //컴포넌트가 state를 가질 수 있게 한다.

    //중괄호 안에는 JS사용 가능.

    const root = document.getElementById("root");
    // const span = React.createElement("span");

    function render() {
    }

    //input 내의 onChange는 내부 값의 변경이 존재하면, 그 변경을 감지한다. 
    function MintoHour() {
        const onChange = (event) => {
            console.log(event.target.value);
            // console.log(event);
            setAmount(event.target.value);
        };

        const [amount, setAmount] = React.useState();
        const [flip, setFlip] = React.useState(false);

        const reset = () => setAmount(0);
        const onFlip = () => {
            reset();
            setFlip((current) => !current)
        };
        return (<div>
            <h3>
                converter
            </h3>
            <label htmlFor="min">min</label>
            <input
                value={flip ? amount * 60 : amount}
                id="min"
                placeholder="Mins"
                type="number"
                onChange={onChange}
                disabled={flip === true}
            />
            <h4> Convert {amount} </h4>

            <label htmlFor="hour">hour</label>
            <input
                value={flip ? amount : Math.round(amount / 60)}
                id="hour"
                placeholder="Hours"
                type="number"
                onChange={onChange}
                disabled={flip === false}
            />
            <button onClick={reset}>Reset</button>
            <button onClick={onFlip}>Flip</button>
        </div>);
    }

    function Another() {
        return (<div>
            <h1> HELLOWORLD </h1>
        </div>)
    }
    function Container() {
        const [index, setIndex] = React.useState();
        const onSelect = (event) => {
            setIndex(event.target.value);
        }
        return (
            <div>
                <h1>super Converter</h1>
                <select value={index} onChange={onSelect}>
                    <option value="0"> min to hour </option>
                    <option value="1"> anotherone </option>
                </select>
                {index === "0" ? <MintoHour /> : null}
                {index === "1" ? <Another /> : null}
            </div>
        )
    }

    ReactDOM.render(<Container />, root);
</script>

</html>
