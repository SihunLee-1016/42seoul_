<!DOCTYPE html>
<html>

<head></head>

<body>
    <div id="root"></div>
</body>
<script src="https://unpkg.com/react@17.0.2/umd/react.production.min.js">
</script>
<script src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.production.min.js">
</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">

    //State는 기본적으로 데이터가 저장되는 곳이다.
    const root = document.getElementById("root");
    let counter = 0;
    // jsx에 변수를 전달하는 방식.

    const span = React.createElement("span");
    function countUp() {
        counter += 1;
        render();
    }
    //위처럼 counUp 함수에서 카운트를 증가시키고, 렌더링을 다시 해주면 UI가 업데이트된다.
    //매번 렌더링을 다시 하도록 함수를 작동하는건 좋지않다.
    //동일한 작동을 하는 JS코드의 element를 보면 body와 span이 계속 업데이트 되는 반면, (전부 다 새로 생성되는건가?)
    // react코드의 경우엔 그렇지 않다. 리액트는 바뀐 부분만 업데이트된다. (토탈클릭). 여러 요소를 리렌더링해도 전부 다 새로 생성되진 않음

    //#3.0에선, 전부 다 리렌더링 해줬지만, 국소적으로 리렌더링을 하는 방법을 #3.1에서 알아볼 것이다.

    function render() {
        ReactDOM.render(<Container />, root);

    }
    const Container = () => (<div>
        <h3>
            Total click: {counter}
        </h3>
        <button onClick={countUp}>
            click me
        </button>
    </div>)
    // 버튼에 onclick을 등록했어도, UI가 리렌더링 되지 않아서 값이 변하는것이 보이지 않음.
    render();
</script>

</html>
